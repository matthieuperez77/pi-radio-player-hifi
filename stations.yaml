# Configuration des stations.
#
# Schéma (plus de switch_pin/led_pin/logo : la sélection passe par l'encodeur
# "tuner" + les 4 favoris, et l'écran est un LCD texte, pas de logos) :
#   id            -> identifiant interne stable (utilisé pour les favoris/état)
#   name          -> nom affiché sur le LCD
#   stream_urls   -> liste ORDONNÉE de flux, du meilleur au plus dégradé ;
#                    Player essaie le premier, puis se replie automatiquement
#                    sur le suivant si mpv signale une erreur de lecture,
#                    avant d'afficher l'écran d'erreur (cf. radio/main.py)
#   metadata.type :
#     radiofrance_livemeta -> nom de la case/émission en cours (station_id
#                             numérique de l'API livemeta - seuls francemusique
#                             (4) et fip (7) sont confirmés à ce stade ; les
#                             autres id restent à identifier, cf. note plus bas)
#     none                  -> pas de métadonnée disponible (LCD : nom de
#                             station seul)

refresh_interval_seconds: 30

# Pour trouver le station_id manquant d'une chaîne Radio France : essayer
# https://api.radiofrance.fr/livemeta/pull/<id> avec de petits entiers et
# vérifier que le nom de chaîne dans la réponse JSON correspond - non
# documenté officiellement, à faire au cas par cas si les métadonnées de
# cette chaîne intéressent particulièrement.

stations:
  # --- Radio France : réseau national (généralistes) ------------------------
  - id: franceinter
    name: "F. Inter"
    stream_urls:
      - "https://icecast.radiofrance.fr/franceinter-hifi.aac?id=radiofrance"
      - "https://icecast.radiofrance.fr/franceinter-midfi.mp3?id=radiofrance"
      - "https://icecast.radiofrance.fr/franceinter-lofi.mp3?id=radiofrance"
